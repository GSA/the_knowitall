[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowitall-code-context"
version = "0.1.0"
description = "Revision-bound code-context provider contracts and local implementation"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.19,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "build>=1.2,<2"]

[tool.hatch.build.targets.sdist]
exclude = [".superpowers", ".local", "pytest-of-*"]

[tool.hatch.build.targets.wheel]
packages = ["src/knowitall_contract", "src/knowitall_snapshot", "src/knowitall_graphify", "src/knowitall_publication", "src/knowitall_query", "src/knowitall_updates"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/knowitall.code-context/v1" = "knowitall_contract/schemas"
"examples/knowitall.code-context/v1" = "knowitall_contract/examples"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
